# Reference nginx site for the platform: one domain serves the React app and forwards /api to Node.
# Compare with your live config (usually /etc/nginx/sites-available/<site>); the lines marked
# REQUIRED are what login needs. Certbot normally manages the ssl_* lines for you.

server {
	listen 80;
	server_name arena.example.com;            # your domain
	return 301 https://$host$request_uri;     # everything goes to HTTPS
}

server {
	listen 443 ssl;
	server_name arena.example.com;

	ssl_certificate     /etc/letsencrypt/live/arena.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/arena.example.com/privkey.pem;

	# The built frontend (npm run build). Point this at frontend/dist, or at FRONTEND_DEST if you copy it.
	root /home/ubuntu/esports-platform/frontend/dist;
	index index.html;

	# The API, on the same origin as the site, so the login cookie (SameSite=Lax) is sent with every request
	location /api/ {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# REQUIRED: tells Express the visitor used HTTPS. With NODE_ENV=production the app trusts this
		# header (trust proxy) and only then sends the Secure session cookie. Without it, login silently fails.
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# REQUIRED: React Router handles pages like /login or /events/4 in the browser. Any path that isn't
	# a real file gets index.html, so refreshing or opening a deep link doesn't 404.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Built assets have hashed names, so they can be cached for a long time
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
