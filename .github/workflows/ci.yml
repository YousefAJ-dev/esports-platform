# Runs on every push and pull request: backend API tests against a throwaway Postgres,
# plus the frontend's lint, unit tests and production build.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # A fresh Postgres just for this run; it disappears when the job ends
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esports_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: esports_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: esports_platform
      DB_USER: esports_app
      DB_PASSWORD: ci_password
      SESSION_SECRET: ci-only-session-secret
      TEST_DB_SCHEMA: esports_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
